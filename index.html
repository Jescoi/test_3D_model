<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>古建筑3D数字展示</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #f6f0e1;
      font-family: "Microsoft YaHei", serif;
    }
    .title {
      text-align: center;
      padding: 2rem 1rem;
      font-size: 24px;
      color: #8a5a32;
    }
  </style>
</head>

<body>

  <div class="title">古建筑三维展示</div>

  <!-- 👇 这是绝对能显示模型的第三人称模式 -->
  <model-viewer
    src="model.glb"
    camera-controls
    auto-rotate
    touch-action="pan-y"
    camera-orbit="0deg 75deg 15m"
    camera-target="0 1 0"
    min-camera-orbit="auto auto 1m"
    max-camera-orbit="auto auto 100m"
    style="width:100%; height:700px; background:#f9f5eb;">
  </model-viewer>

</body>
</html>
