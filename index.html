<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>古建筑3D展示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f6f0e1; font-family: "Microsoft YaHei", sans-serif; }
  #log { color: #8a5a32; padding: 20px; text-align: center; font-size: 18px; }
</style>
</head>
<body>
<div id="log">模型加载中...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const log = document.getElementById('log');

// 1. 基础场景初始化
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf6f0e1);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 3, 10);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// 2. 鼠标控制
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// 3. 灯光
const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(5, 10, 5);
scene.add(dirLight);

// 4. 模型加载（带Draco解码器）
const loader = new GLTFLoader();
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
loader.setDRACOLoader(dracoLoader);

loader.load(
  './model.glb',
  function (gltf) {
    const model = gltf.scene;
    scene.add(model);
    log.textContent = "✅ 模型加载成功！拖动鼠标旋转查看";
    log.style.color = "green";

    // 自动调整相机视角
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());

    const maxDim = Math.max(size.x, size.y, size.z);
    const fov = camera.fov * (Math.PI / 180);
    const cameraZ = Math.abs(maxDim / Math.sin(fov / 2) / 2);

    camera.position.set(center.x, center.y + size.y / 2, center.z + cameraZ * 1.5);
    controls.target.copy(center);
    controls.update();
  },
  function (xhr) {
    if (xhr.total > 0) {
      log.textContent = `⏳ 加载进度: ${(xhr.loaded / xhr.total * 100).toFixed(0)}%`;
    }
  },
  function (error) {
    log.textContent = `❌ 加载失败: ${error.message}`;
    log.style.color = "red";
    console.error(error);
  }
);

// 5. 渲染循环
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// 窗口自适应
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
