<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>古建筑3D展示 - 第一人称视角</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f6f0e1; font-family: "Microsoft YaHei", sans-serif; }
  #log { color: #8a5a32; padding: 20px; text-align: center; font-size: 18px; }
</style>
</head>
<body>
<div id="log">模型加载中...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const log = document.getElementById('log');

// 场景
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf6f0e1);

// 相机
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 3, 10); // 你之后可以换成你测量的坐标

// 渲染器
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// ========== 核心：第一人称原地环视 ==========
const controls = new OrbitControls(camera, renderer.domElement);

// 禁止平移、禁止缩放
controls.enablePan = false;
controls.enableZoom = false;

// 只允许旋转视角（第一人称效果）
controls.enableRotate = true;
controls.enableDamping = true;
controls.dampingFactor = 0.05;

// 相机自身不动，只转头
controls.maxPolarAngle = Math.PI / 2;
controls.minPolarAngle = Math.PI / 4;
// ==========================================

// 灯光
const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(5, 10, 5);
scene.add(dirLight);

// 模型加载
const loader = new GLTFLoader();
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
loader.setDRACOLoader(dracoLoader);

loader.load(
  './chaodonglou_f1.glb',
  function (gltf) {
    const model = gltf.scene;
    scene.add(model);
    log.textContent = "✅ 第一人称模式：鼠标拖动转头环视";
    log.style.color = "green";

    // 自动对准模型
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    controls.target.copy(center);
    controls.update();
  },
  function (xhr) {},
  function (error) {
    log.textContent = "❌ 加载失败：" + error.message;
    log.style.color = "red";
  }
);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
