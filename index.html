<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>古建筑3D展示 - 第一人称</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    background: #f6f0e1; 
    font-family: "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 30px;
  }
  #log { 
    color: #8a5a32; 
    padding: 10px 20px; 
    text-align: center; 
    font-size: 18px;
  }
  /* 3D 容器：一个带边框的方框 */
  #viewer {
    width: 1200px;
    height: 700px;
    border: 2px solid #ccc;
    border-radius: 8px;
    overflow: hidden;
    background: #fff;
  }
</style>
</head>
<body>
<div id="log">模型加载中...</div>
<!-- 3D 模型放在这个盒子里 -->
<div id="viewer"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const log = document.getElementById('log');
const container = document.getElementById('viewer');

// 场景
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf6f0e1);

// 相机：整体往下移（y 从 3 → 1.6）
const camera = new THREE.PerspectiveCamera(50, 1200 / 700, 0.1, 1000);
camera.position.set(0, 1.6, 10);

// 渲染器
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(1200, 700);
container.appendChild(renderer.domElement);

// 第一人称环视：只能转头，不能移动、缩放
const controls = new OrbitControls(camera, renderer.domElement);
controls.enablePan = false;
controls.enableZoom = false;
controls.enableRotate = true;
controls.enableDamping = true;
controls.dampingFactor = 0.05;

// 灯光
const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(5, 10, 5);
scene.add(dirLight);

// 模型加载
const loader = new GLTFLoader();
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
loader.setDRACOLoader(dracoLoader);

loader.load(
  // ====== 在这里改模型文件名 ======
  './cahodonglou_f1.glb',
  // ==============================

  function (gltf) {
    const model = gltf.scene;
    scene.add(model);
    log.textContent = "✅ 第一人称：鼠标拖动转头环视";
    log.style.color = "green";

    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    controls.target.copy(center);
    controls.update();
  },
  function (xhr) {},
  function (error) {
    log.textContent = "❌ 加载失败：" + error.message;
    log.style.color = "red";
  }
);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
