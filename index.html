<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五3D展示框（本地优先版）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    background: #f6f0e1; 
    font-family: "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 0;
    gap: 40px;
  }
  .log { 
    color: #8a5a32; 
    padding: 10px 20px; 
    text-align: center; 
    font-size: 18px;
  }
  .viewer {
    width: 1200px;
    height: 700px;
    border: 2px solid #ccc;
    border-radius: 8px;
    overflow: hidden;
    background: #fff;
  }
</style>
</head>

<body>

<div class="log" id="log1">模型1加载中...</div>
<div class="viewer" id="viewer1"></div>

<div class="log" id="log2">模型2加载中...</div>
<div class="viewer" id="viewer2"></div>

<div class="log" id="log3">模型3加载中...</div>
<div class="viewer" id="viewer3"></div>

<div class="log" id="log4">模型4加载中...</div>
<div class="viewer" id="viewer4"></div>

<div class="log" id="log5">模型5加载中...</div>
<div class="viewer" id="viewer5"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const bgColor = 0xd5d5d5;
const sensitivity = 0.003;

// 开启Three.js缓存，第二次打开秒加载
THREE.Cache.enabled = true;

const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');

// 存储viewer，用于页面卸载时销毁
const viewers = [];

function createViewer(containerId, logId, modelUrl, cameraPos, initAzimuth = 0, pitchAngle = 0.35) {
  return new Promise((resolve) => {
    const container = document.getElementById(containerId);
    const log = document.getElementById(logId);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(bgColor);

    const camera = new THREE.PerspectiveCamera(50, 1200 / 700, 0.1, 2000);
    camera.position.copy(cameraPos);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(1200, 700);
    container.appendChild(renderer.domElement);

    let azimuth = -Math.PI/2 + initAzimuth;
    let polar = Math.PI/2 - pitchAngle;

    renderer.domElement.addEventListener('mousemove', (e) => {
      if (!e.buttons) return;
      azimuth -= e.movementX * sensitivity;
      polar -= e.movementY * sensitivity;
      polar = Math.max(Math.PI / 6, Math.min(Math.PI * 5 / 6, polar));
    });

    let lastX = 0, lastY = 0;
    renderer.domElement.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
      }
    });
    renderer.domElement.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1) {
        e.preventDefault();
        let dx = e.touches[0].clientX - lastX;
        lastX = e.touches[0].clientX;
        let dy = e.touches[0].clientY - lastY;
        lastY = e.touches[0].clientY;
        azimuth -= dx * sensitivity;
        polar -= dy * sensitivity;
        polar = Math.max(Math.PI / 6, Math.min(Math.PI * 5 / 6, polar));
      }
    });

    const ambient = new THREE.AmbientLight(0xffffff, 1.5);
    scene.add(ambient);
    const direct = new THREE.DirectionalLight(0xffffff, 1);
    direct.position.set(5, 10, 5);
    scene.add(direct);

    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);

    loader.load(
      modelUrl,
      (gltf) => {
        scene.add(gltf.scene);
        log.textContent = "✅ 按住鼠标拖动查看";
        log.style.color = "green";
        viewers.push({ scene, camera, renderer });
        resolve();
      },
      undefined,
      (err) => {
        log.textContent = "❌ 加载失败：" + err.message;
        log.style.color = "red";
        console.error(err);
        resolve();
      }
    );

    function animate() {
      requestAnimationFrame(animate);
      const dir = new THREE.Vector3(
        Math.sin(azimuth) * Math.sin(polar),
        Math.cos(polar),
        Math.cos(azimuth) * Math.sin(polar)
      );
      camera.lookAt(
        camera.position.x + dir.x,
        camera.position.y + dir.y,
        camera.position.z + dir.z
      );
      renderer.render(scene, camera);
    }
    animate();
  });
}

// 预加载队列：一个加载完再加载下一个，避免同时请求被限制
async function loadAllViewers() {
  // 1 朝东楼：俯仰10°
  await createViewer('viewer1', 'log1', './chaodonglou_f5.glb', new THREE.Vector3(3, 2, 4), 0, 0.17);
  // 2 坑墙楼
  await createViewer('viewer2', 'log2', './kenqianglou_f5.glb', new THREE.Vector3(30, 3, 0));
  // 3 清净寺
  await createViewer('viewer3', 'log3', './qingjinsi_f1.glb', new THREE.Vector3(3, 3, -20), Math.PI/2);
  // 4 天后宫：俯仰10°
  await createViewer('viewer4', 'log4', './tianhougong_f1.glb', new THREE.Vector3(25, 3, -1), 0, 0.17);
  // 5 万寿塔：相机同朝东楼
  await createViewer('viewer5', 'log5', './wanshouta_f1.glb', new THREE.Vector3(25, 2, 4));
}

// 页面卸载时销毁所有资源，避免显存泄漏
window.addEventListener('beforeunload', () => {
  viewers.forEach(v => {
    if (v.renderer) v.renderer.dispose();
  });
});

// 启动加载队列
loadAllViewers();
</script>
</body>
</html>
