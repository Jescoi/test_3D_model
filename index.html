<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>古建筑3D展示 - 第一人称原地环视</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    background: #f6f0e1; 
    font-family: "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 30px;
  }
  #log { 
    color: #8a5a32; 
    padding: 10px 20px; 
    text-align: center; 
    font-size: 18px;
  }
  #viewer {
    width: 1200px;
    height: 700px;
    border: 2px solid #ccc;
    border-radius: 8px;
    overflow: hidden;
    background: #fff;
  }
</style>
</head>
<body>
<div id="log">模型加载中...</div>
<div id="viewer"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const log = document.getElementById('log');
const container = document.getElementById('viewer');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf6f0e1);

// 相机位置（可自己微调）
const camera = new THREE.PerspectiveCamera(50, 1200 / 700, 0.1, 1000);
camera.position.set(10, 2, 15);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(1200, 700);
container.appendChild(renderer.domElement);

// 第一人称鼠标控制变量
let mouseX = 0, mouseY = 0;
let azimuth = 0, polar = Math.PI / 2;
const sensitivity = 0.003;

// 鼠标移动控制视角
document.addEventListener('mousemove', (e) => {
  if (!e.buttons) return; // 只在按住鼠标时旋转
  azimuth -= e.movementX * sensitivity;
  polar -= e.movementY * sensitivity;
  // 限制抬头低头角度
  polar = Math.max(Math.PI / 6, Math.min(Math.PI * 5 / 6, polar));
});

// 灯光
const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(5, 10, 5);
scene.add(dirLight);

// 模型加载
const loader = new GLTFLoader();
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
loader.setDRACOLoader(dracoLoader);

loader.load(
  './model.glb',
  function (gltf) {
    scene.add(gltf.scene);
    log.textContent = "✅ 第一人称：按住鼠标拖动转头";
    log.style.color = "green";
  },
  function (xhr) {},
  function (error) {
    log.textContent = "❌ 加载失败：" + error.message;
    log.style.color = "red";
  }
);

// 原地旋转逻辑
function animate() {
  requestAnimationFrame(animate);

  const dir = new THREE.Vector3(
    Math.sin(azimuth) * Math.sin(polar),
    Math.cos(polar),
    Math.cos(azimuth) * Math.sin(polar)
  );

  camera.lookAt(
    camera.position.x + dir.x,
    camera.position.y + dir.y,
    camera.position.z + dir.z
  );

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
