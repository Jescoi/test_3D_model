<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>古建筑3D展示</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#f6f0e1; font-family:Microsoft YaHei;}
  .title{text-align:center;padding:2rem;color:#8a5a32;}
  #container{width:100%;height:700px;background:#f9f5eb;}
</style>
</head>

<body>
<div class="title">古建筑三维数字展示</div>
<div id="container"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
let container = document.getElementById('container');
let scene, camera, renderer, controls;

init();
animate();

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf9f5eb);

  camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.set(0, 3, 10);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  const ambientLight = new THREE.AmbientLight(0xffffff, 1);
  scene.add(ambientLight);
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(5, 10, 5);
  scene.add(dirLight);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  const loader = new THREE.GLTFLoader();
  
  // 👇 这里我直接写你仓库真实文件名！！！
  loader.load('./model.glb', (gltf) => {
    scene.add(gltf.scene);
    console.log("✅ 模型加载成功！");
  }, undefined, (error) => {
    console.error("❌ 模型加载失败：", error);
  });
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
</script>
</body>
</html>
